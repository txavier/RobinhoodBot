apiVersion: batch/v1
kind: Job
metadata:
  name: robinhoodbot-optimizer
  namespace: robinhoodbot
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400  # Auto-cleanup after 24h
  template:
    metadata:
      labels:
        app: robinhoodbot-optimizer
    spec:
      restartPolicy: Never
      priorityClassName: robinhoodbot-high
      # The optimizer shares the ReadWriteOnce PVC (robinhoodbot-optimizer-data)
      # with the Ray head pod. RWO volumes only attach to one node at a time, so
      # the optimizer MUST schedule onto the same node that hosts the Ray head,
      # otherwise it deadlocks with a Multi-Attach error.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  ray.io/node-type: head
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      initContainers:
        - name: wait-for-ray
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Waiting for Ray head..."; until nc -z optimizer-ray-head-svc.robinhoodbot.svc.cluster.local 10001; do sleep 5; done; echo "Ray head is ready"']
      containers:
        - name: optimizer
          # Pinned to the SAME immutable digest as the Ray cluster (Ray 2.56.1)
          # so the optimizer never joins a mismatched Ray head. Repointed by
          # deploy.sh on every build. imagePullPolicy IfNotPresent guarantees
          # the pinned digest is used even if :latest is later repushed.
          image: REGISTRY_HOST:5000/robinhoodbot:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "genetic_optimizer_intraday.py"]
          args:
            - "--num-stocks=600"
            - "--max-positions=10"
            - "--generations=50"
            - "--population=56"
            - "--real-data"
            - "--resume"
            - "--validate-real"
            - "--days=365"
            - "--train-test-split=0.7"
            - "--mutation-rate=0.25"
            - "--optimize-filters"
            - "--use-ray"
            # - "--disable-ray-mem-monitor"
            - "--email-notify"
            - "--output=/app/data/genetic_optimization_intraday_result.json"
            - "--checkpoint-file=/app/data/genetic_optimization_intraday_result.checkpoint.json"
            - "--log-file=/app/logs/optimizer_output.log"
          env:
            - name: TZ
              value: "America/New_York"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATA_DIR
              value: "/app/data"
            - name: LOG_DIR
              value: "/app/logs"
            - name: S3_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
            - name: RAY_ADDRESS
              value: "ray://optimizer-ray-head-svc.robinhoodbot.svc.cluster.local:10001"
            - name: RAY_gcs_rpc_server_reconnect_timeout_s
              value: "120"
            - name: RAY_grpc_client_keepalive_time_ms
              value: "10000"
            - name: RAY_grpc_client_keepalive_timeout_ms
              value: "20000"
            - name: RAY_CLIENT_RECONNECT_GRACE_PERIOD
              value: "120"
            - name: GRPC_KEEPALIVE_PERMIT_WITHOUT_CALLS
              value: "1"
          livenessProbe:
            exec:
              command: ["sh", "-c", "[ -n \"$(find /tmp/optimizer-heartbeat -mmin -30)\" ]"]
            initialDelaySeconds: 300
            periodSeconds: 120
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config.py
              subPath: config.py
              readOnly: true
            - name: data
              mountPath: /app/data
            # Dedicated (non-shared) PVC for the Ray CV/market-data pickle cache.
            # The CV pickle is written here (DATA_DIR/.ray_shared_data, see
            # genetic_optimizer_intraday.py ~L1527). It MUST NOT live on the
            # shared robinhoodbot-optimizer-data RWO PVC that the Ray head also
            # mounts RW — that dual-mount contention stalled the optimizer in
            # disk-sleep writing the pickle. This volume shadows /app/data/.ray_shared_data.
            - name: cv-cache
              mountPath: /app/data/.ray_shared_data
            - name: data
              mountPath: /app/.yfinance_cache
              subPath: .yfinance_cache
            - name: data
              mountPath: /app/logs
              subPath: logs/optimizer
          resources:
            requests:
              # Measured peak working-set ~1.77Gi (Prometheus, run 2026-07-20).
              # 2.5Gi request gives ~40% headroom for data-load/checkpoint spikes.
              memory: "2560Mi"
              cpu: "500m"
            limits:
              # Was 5Gi; real peak is ~1.77Gi, so 3Gi cap still leaves ~70% headroom
              # while preventing a runaway optimizer from starving the Ray head node.
              memory: "3Gi"
              cpu: "1000m"
      volumes:
        - name: config
          secret:
            secretName: robinhoodbot-config
        - name: data
          persistentVolumeClaim:
            claimName: robinhoodbot-optimizer-data
        - name: cv-cache
          persistentVolumeClaim:
            claimName: robinhoodbot-optimizer-cv-cache
